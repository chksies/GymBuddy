# Render blueprint for the API. See DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: gymlock-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DB_NAME
        value: gymbuddy_db
      # Paste your MongoDB Atlas connection string when Render asks
      - key: MONGO_URL
        sync: false
      # Your web app's address, e.g. https://gymlock.vercel.app (no trailing slash)
      - key: CORS_ORIGINS
        sync: false
      # Generated for you; signs everyone's logins, so never share or commit it
      - key: JWT_SECRET
        generateValue: true
